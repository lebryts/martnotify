<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MartNotify | Premium Lead Monitoring</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="glass-bg"></div>

    <main class="dashboard">
        <header class="top-bar">
            <div class="logo">
                <span class="icon">🚀</span>
                <h1>MartNotify</h1>
            </div>
            <div class="status-badge" id="monitorStatus">
                <span class="dot"></span>
                <span class="text">Standby</span>
            </div>
        </header>

        <section class="main-grid">
            <!-- Configuration Card -->
            <div class="card config-card">
                <h2>Configuration</h2>
                <div class="input-group">
                    <label>Search Query</label>
                    <input type="text" id="searchQuery" placeholder="e.g. cocopeat block">
                </div>
                <div class="row">
                    <div class="input-group">
                        <label>Min Qty (Kg)</label>
                        <input type="number" id="minQty" placeholder="10000">
                    </div>
                    <div class="input-group">
                        <label>Min Value (₹)</label>
                        <input type="number" id="minValue" placeholder="300000">
                    </div>
                </div>
                <div class="input-group">
                    <label>ntfy Topic</label>
                    <input type="text" id="ntfyTopic" placeholder="your_private_topic">
                </div>

                <div class="form-group full-width">
                    <label for="imCookie">Indiamart Cookie (Session):</label>
                    <input type="password" id="imCookie"
                        placeholder="Paste full 'Cookie:' string from Network tab here">
                </div>
                <div class="form-group full-width">
                    <label for="userAgent">Browser User-Agent:</label>
                    <input type="text" id="userAgent"
                        placeholder="Must EXACTLY match the browser you stole the cookie from!">
                </div>
                <p class="hint">Required for reliable scraping. Get it from your browser's Network tab.</p>

                <div class="actions">
                    <button id="saveConfig" class="btn secondary">Update Settings</button>
                    <button id="toggleMonitor" class="btn primary">Start Monitoring</button>
                </div>
            </div>

            <!-- Stats & Control -->
            <div class="card control-card">
                <div class="stat">
                    <span class="label">Last Activity</span>
                    <span class="value" id="lastCheck">Never</span>
                </div>
                <button id="scanNow" class="btn outline">
                    <span class="icon">🔍</span> Scan Now
                </button>
                <div class="ntfy-link">
                    <p>Get notified on your phone:</p>
                    <a href="#" id="ntfyUrl" target="_blank">ntfy.sh/topic</a>
                    <button id="testNotify" class="btn-text" style="display:block; margin-top:0.5rem;">Send Test
                        Notify</button>
                </div>
            </div>

            <!-- Logs Card -->
            <div class="card logs-card">
                <div class="header-with-action">
                    <h2>Activity Logs</h2>
                    <div class="actions-row">
                        <button id="clearHistory" class="btn-text">Clear Lead Memory</button>
                        <button id="clearLogs" class="btn-text">Clear Logs</button>
                    </div>
                </div>
                <div class="log-container" id="logContainer">
                    <div class="log-entry system">Initializing system...</div>
                </div>
            </div>

            <!-- Audit Card -->
            <div class="card audit-card">
                <div class="header-with-action">
                    <h2>Processed Lead Details (Audit)</h2>
                    <button id="refreshAudit" class="btn-text">Refresh</button>
                </div>
                <div class="audit-container" id="auditContainer">
                    <pre id="auditContent">No scan data available.</pre>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
