name: IndiaMart Lead Monitor

on:
  schedule:
    # Every 5 minutes (GitHub Actions minimum interval)
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Allow external triggers (e.g. cron-job.org via GitHub API)

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests redis python-dotenv

      - name: Run scanner
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          INDIAMART_COOKIE: ${{ secrets.INDIAMART_COOKIE }}
        run: python3 scanner.py
